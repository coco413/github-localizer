<!doctype html>
<title>Issues · octocat/Hello-World · GitHub</title>
<main>
  <div id="repo-content-pjax-container">
    <input type="search" aria-label="Search issues" value="is:issue state:open">
    <header>
      <button type="button" onclick="document.querySelector('dialog').showModal()">Filters</button>
    </header>
    <dialog aria-label="Filter issues">
      <button type="button">Open</button>
      <button type="button">Closed</button>
    </dialog>
    <a href="?q=is%3Aissue+state%3Aopen"><span>Open</span> <span>3</span></a>
    <h2>No results</h2>
    <a href="./issues/10" data-testid="issue-title">Open</a>
    <button type="button">OPEN</button>
    <button type="button" aria-label="Open 3"><span>Open</span> <span>3</span></button>
  </div>
</main>
