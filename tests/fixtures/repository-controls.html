<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signed-out repository controls</title>
  <style>
    [data-component="SplitPageLayout.Header"] { display: none; }
    @media (max-width: 767px) {
      [data-component="SplitPageLayout.Header"] { display: block; }
      [data-component="SplitPageLayout.Pane"] { display: none; }
    }
  </style>
</head>
<body>
<main>
  <react-app app-name="code-view">
    <ul data-testid="repo-header-actions">
      <li><a data-testid="fork-button" href="/login?return_to=%2Foctocat%2FHello-World" aria-label="You must be signed in to fork a repository"><span data-component="text">Fork</span> <strong>7</strong></a></li>
      <li><a data-testid="notifications-sign-in-button" href="/login?return_to=%2Foctocat%2FHello-World" aria-label="You must be signed in to change notification settings"><span data-component="text">Notifications</span></a></li>
    </ul>
    <div data-component="SplitPageLayout.Header"><div class="sidebarSection__fixture"><h2><span>About</span></h2></div></div>
    <aside data-component="SplitPageLayout.Pane"><div class="sidebarSection__fixture"><h2><span>About</span></h2></div></aside>
    <article>About</article>
  </react-app>
</main>
</body>
</html>
