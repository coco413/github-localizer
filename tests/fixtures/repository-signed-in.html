<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Signed-in repository controls</title></head>
<body>
<main>
  <react-app app-name="code-view">
    <ul data-testid="repo-header-actions">
      <li>
        <details>
          <summary role="button"><span data-component="text">Watch</span></summary>
          <div role="menu"><button role="menuitem"><span data-component="text">Participating and @mentions</span></button></div>
        </details>
      </li>
      <li><button data-testid="star-button" aria-label="Unstar this repository"><span data-component="text">Starred</span> <strong>9</strong></button></li>
    </ul>
  </react-app>
</main>
</body>
</html>
